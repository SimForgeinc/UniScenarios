<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>UniScenarios</title>
    <style>
      html, body, #root { margin: 0; height: 100%; overflow: hidden; background: #0b0d10; }
      /* Dark scrollbars in the tool rails — the default light ones read as a
         rendering bug against the panels. */
      *::-webkit-scrollbar { width: 8px; height: 8px; }
      *::-webkit-scrollbar-track { background: transparent; }
      *::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.14);
        border-radius: 4px;
      }
      *::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.24); }
      * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.18) transparent; }
      /* The number inputs in the inspector are for typing, not for spinners. */
      input[type='number']::-webkit-inner-spin-button,
      input[type='number']::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
      input[type='number'] { -moz-appearance: textfield; }
      @keyframes world-loading-spin { to { transform: rotate(360deg); } }
      @keyframes world-loading-pulse { 50% { filter: brightness(1.28); } }
      .world-loading-spinner { animation: world-loading-spin .8s linear infinite; }
      .world-loading-progress { animation: world-loading-pulse 1.4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .world-loading-spinner, .world-loading-progress { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
