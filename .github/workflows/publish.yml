name: Publish immutable UniScenarios stack

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @uniscenarios/scenario-model test
      - run: pnpm --filter @uniscenarios/sim-engine test
      - run: pnpm --filter @uniscenarios/scenario-materializer test
      - run: pnpm --filter @uniscenarios/editor-core test
      - run: pnpm --filter @uniscenarios/city-renderer test
      - run: pnpm --filter @uniscenarios/prop-catalog test
      - run: pnpm -r --filter "./packages/**" build
      - run: pnpm release:manifest
      - run: pnpm release:verify-artifacts
      - run: pnpm release:smoke-packages
      - name: Verify tag and publish with npm provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('config/uniscenarios-stack.json'));if(process.env.GITHUB_REF_NAME!=='v'+c.stackVersion)throw new Error('tag must equal v'+c.stackVersion)"
          pnpm --filter "./packages/**" publish --recursive --access public --provenance --no-git-checks

  publish-carla-bridge:
    needs: publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify release identity
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          config = json.loads(pathlib.Path("config/uniscenarios-stack.json").read_text())
          expected = "v" + config["stackVersion"]
          assert os.environ["GITHUB_REF_NAME"] == expected, f"tag must equal {expected}"
          project = pathlib.Path("adapters/carla-bridge/pyproject.toml").read_text()
          version = re.search(r'^version = "([^"]+)"', project, re.MULTILINE).group(1)
          assert version == config["stackVersion"].replace("-rc.", "rc"), "CARLA wheel version is not stack-aligned"
          PY
      - name: Test and build public CARLA adapter
        run: |
          python -m pip install "build==1.3.0" "./adapters/carla-bridge[dev]"
          python -m pytest adapters/carla-bridge/tests -q
          python -m build adapters/carla-bridge
          python -m venv /tmp/uniscenarios-carla-smoke
          /tmp/uniscenarios-carla-smoke/bin/python -m pip install adapters/carla-bridge/dist/*.whl
          /tmp/uniscenarios-carla-smoke/bin/uniscenarios-carla --help
      - name: Publish immutable PyPI wheel and source distribution with provenance
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: adapters/carla-bridge/dist/
          attestations: true
